[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tetrative-agentic-os"
version = "0.5.0"
description = "Provider-agnostic, local-first cognitive orchestration kernel for UGC and venture creation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "agentic-UGC contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8", "ruff>=0.6"]

[project.scripts]
tetrative = "tetrative_os.cli:main"
tetrative-api = "tetrative_os.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tetrative_os = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
