## 8. USER ROLE MAPPINGS

Every user interaction maps to agent routing rules:

```
ENTREPRENEUR        → Diagnosis Crew + Product Crew + Ecosystem Crew
CREATOR             → Content Engine + Cinematic Pipeline + Channel Graph
FILMMAKER           → Cinematic Pipeline + Story Development + Red Team
ECOSYSTEM ARCHITECT → Ecosystem Crew + Meta-Evolution + Analytics
SOVEREIGN ARCHITECT → Master Orchestrator + Governance + Self-Evolution
FORWARD DEPLOYED    → Deployment Engine + MVP Engineer + Stress Test
DEPLOY ENGINEER     → Deployment Engine + Analytics + Governance
```

The Master Orchestrator selects the role mapping and activates the relevant agent cluster.

---

## 9. AGENT ACTIVATION PROTOCOL

```
1. User submits request (natural language or structured)
2. Master Orchestrator parses role + intent
3. Context packet built (≤ 10KB) with memory pins
4. Primary agent assigned via registry lookup
5. Output contract confirmed by assigned agent
6. State machine transition validated
7. Red Team scheduled (if priority ≥ medium)
8. Agent executes with tool access
9. Output validated against contract
10. Memory banks updated (all 6, where relevant)
11. Human gate triggered (if required by governance)
12. State updated; next action proposed
```

---

## 10. REGISTRY MAINTENANCE

- Updates require `Self-Evolution Engine` proposal + `Governance Guardian` approval.
- Every agent version must include updated `FAILURE_CONDITIONS`.
- Registry changes are logged in `OPERATIONAL_MEMORY` with rollback reference.
- Unregistered agents must not receive context packets.
