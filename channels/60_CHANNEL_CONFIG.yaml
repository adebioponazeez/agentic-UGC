### 2.2 SHORT-FORM SENSOR (10 channels — within Shorts Lab)
```
16. OMEGA-TEST-A         Hook Pattern Testing / Narrative Experiments
17. OMEGA-TEST-B         Visual Format Testing / Cinematic Grammar
18. OMEGA-TEST-C         Topic Signal Testing / Cultural Signals
19. OMEGA-TEST-D         Character / Voice Testing / Performance Styles
20. OMEGA-TEST-E         Question Format Testing / Audience Engagement
21. OMEGA-TEST-F         Social-Native Format / Platform-Specific Experiments
22. OMEGA-TEST-G         Data Visualization / Information Design Tests
23. OMEGA-TEST-H         Mixed-Media / Collage / Hybrid Visual Tests
24. OMEGA-TEST-I         Interactive / Participatory / Audience-Driven Experiments
25. OMEGA-TEST-J         Generative / Real-Time / Adaptive Content Tests
```

**Editorial Constitution — Sensor Short:**
- Format: 15–60 seconds; designed for rapid signal detection
- Hypothesis: Every video must test one explicit hypothesis (hook format, topic, visual approach)
- Metrics: Primary metric is validated signal strength (not just views — comment quality, retention curve shape, search signal generation)
- Memory: Every experiment writes structured result to `CREATIVE` memory (pattern validated or rejected)
- Propagation: Validated signals (retention > 50% at 15 sec + positive comment sentiment + search signal) propagate to Long-Form cluster
- Anti-Slop: Generic content is automatic failure; experiment must have originality claim

