## 4. DOCUMENTARY CLUSTER (Embedded in Faceless + Long-Form)

Not separate channels, but a cross-cutting format cluster that operates across:
- `OMEGA-DOCUMENTARY` (Short-form documentary)
- `OMEGA-DOCUMENTARY-LF` (Long-form documentary series)
- `OMEGA-INVESTIGATIVE` (Investigative short-form)
- `OMEGA-INVESTIGATIVE-LF` (Investigative long-form)

**Documentary Constitution:**
- Truth: Every claim must be verifiable; sources must exist and be referenceable
- Visual Evidence: Footage, data visualization, expert testimony, or primary documentation must support claims
- Narrative Integrity: Story must follow evidence; evidence must not be shaped to fit pre-existing narrative
- Authorial Identity: Documentary must express a specific perspective or question, not pretend neutrality
- Ethical Standards: No fabrication, no synthetic evidence, no misleading editing
- Anti-Slop: Cinematic quality must serve truth; beautiful shots must add information or emotional truth, not decoration

---

## 5. CHANNEL GRAPH OPERATIONS (OMEGA-C5)

### 5.1 Propagation Rules

```
SHORTS LAB SIGNAL DETECTED
  ↓ [Validation: retention > 50% at 15 sec + positive sentiment + search signal]
VALIDATED SIGNAL
  ↓ [Channel Graph Operator evaluates transformation requirements]
TRANSFORMED OUTPUT DESIGNED (not duplicated — transformed for new format / audience / depth)
  ↓ [Long-Form Channel Design]
LONG-FORM PRODUCTION
  ↓ [Series Validation]
DOCUMENTARY / SERIES EXPANSION
  ↓ [Product / Enterprise Integration]
FULL ECOSYSTEM PROPAGATION
```

**Transformation Requirements:**
Every propagated output must:
- Change format (not just length — structure, visual approach, emotional architecture)
- Change depth (add evidence, analysis, or perspective not present in source)
- Change audience relationship (serve different need in audience journey)
- Reference source (memory graph edge from new output to source signal)
- Add new creative contribution (not mechanical duplication)

